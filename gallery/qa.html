<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>QA contact sheet</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root { color-scheme: light; }
  body { margin: 0; background: #d9d6cf; font: 14px/1.3 'Avenir Next', 'Segoe UI', Helvetica, Arial, sans-serif; color: #1f2328; }
  header { padding: 10px 14px; font-weight: 600; display: flex; gap: 18px; flex-wrap: wrap; }
  header span { font-weight: 400; color: #57606a; }
  #grid { display: grid; gap: 12px; padding: 0 14px 14px; }
  figure { margin: 0; background: #fff; border-radius: 6px; overflow: hidden; box-shadow: 0 1px 2px rgba(0,0,0,.15); }
  .frame { position: relative; background-color: #fff;
    background-image: linear-gradient(45deg, #eee 25%, transparent 25%), linear-gradient(-45deg, #eee 25%, transparent 25%), linear-gradient(45deg, transparent 75%, #eee 75%), linear-gradient(-45deg, transparent 75%, #eee 75%);
    background-size: 20px 20px; background-position: 0 0, 0 10px, 10px -10px, -10px 0; }
  .frame.solid { background-image: none; }
  .safe { position: absolute; border: 1px dashed rgba(200, 40, 40, .55); pointer-events: none; }
  figcaption { padding: 5px 8px; font-size: 13px; display: flex; justify-content: space-between; }
  #error { color: #b00020; white-space: pre-wrap; padding: 14px; font-family: monospace; }
</style>
</head>
<body>
<header id="head">Loading…</header>
<div id="grid"></div>
<div id="error"></div>
<script type="module" src="./qa.js"></script>
</body>
</html>
